<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control de requisitos SAG</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#500015">
<link rel="icon" href="icons/192.png">
<script src="lib/msal-browser.min.js"></script>
<style>
:root{
  /* Layout: barra vino fija arriba, tablero de operación debajo; el estado se lee por color y forma */
  --vino:#500015; --vino-2:#6d1226; --dorado:#D4A437; --crema:#FAF6F1; --papel:#ffffff;
  --tinta:#2a1a1e; --suave:#75666a; --linea:#e7dccd;
  --ok:#2e7d4f; --ok-bg:#e4f2e9; --warn:#a8690b; --warn-bg:#fbefd3; --crit:#b3261e; --crit-bg:#fbe3e1; --neutro-bg:#efe8de;
  --fuente:Calibri,Carlito,"Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--crema);color:var(--tinta);font-family:var(--fuente);font-size:16px;line-height:1.35}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--dorado);outline-offset:2px}
header{background:var(--vino);color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding:10px 20px;border-bottom:4px solid var(--dorado)}
header h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.2px}
header h1 small{display:block;font-size:12px;font-weight:400;color:#e9d9b0;letter-spacing:.6px;text-transform:uppercase}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{color:#f3e7ea;text-decoration:none;padding:7px 14px;border-radius:6px;font-weight:700}
nav a.on{background:var(--dorado);color:var(--vino)}
nav a:hover:not(.on){background:var(--vino-2)}
.quien{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:14px}
.quien input{background:#fff;border:0;border-radius:6px;padding:6px 10px;width:170px;color:var(--tinta)}
main{padding:18px 20px 60px;max-width:1500px;margin:0 auto}
.aviso{background:var(--warn-bg);border-left:5px solid var(--warn);padding:10px 14px;border-radius:6px;margin-bottom:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--papel);border:1px solid var(--linea);border-left:6px solid var(--suave);border-radius:8px;padding:12px 16px}
.tile b{display:block;font-size:34px;line-height:1.05;font-variant-numeric:tabular-nums}
.tile span{color:var(--suave);font-size:14px}
.tile.crit{border-left-color:var(--crit)} .tile.crit b{color:var(--crit)}
.tile.warn{border-left-color:var(--warn)} .tile.warn b{color:var(--warn)}
.tile.ok{border-left-color:var(--ok)} .tile.ok b{color:var(--ok)}
.barra{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.barra .sp{flex:1}
input[type=text],input[type=date],input[type=search],select,textarea{background:#fff;border:1px solid #cfc2b1;border-radius:6px;padding:7px 10px}
textarea{width:100%;min-height:120px}
.btn{background:var(--vino);color:#fff;border:0;border-radius:6px;padding:8px 16px;font-weight:700;cursor:pointer}
.btn:hover{background:var(--vino-2)}
.btn.sec{background:#fff;color:var(--vino);border:1px solid var(--vino)}
.btn.sec:hover{background:#f6ecee}
.btn.oro{background:var(--dorado);color:var(--vino)}
.btn.pel{background:#fff;color:var(--crit);border:1px solid var(--crit)}
.btn.chico{padding:4px 10px;font-size:14px}
.tabla{overflow-x:auto;background:var(--papel);border:1px solid var(--linea);border-radius:8px}
table{border-collapse:collapse;width:100%}
th{background:var(--vino);color:#fff;text-align:left;font-size:14px;padding:9px 12px;white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--linea);vertical-align:middle}
tr.fila{cursor:pointer}
tr.fila:hover td{background:#fbf3e2}
tr.fila td:first-child{border-left:6px solid transparent}
tr.e-crit td:first-child{border-left-color:var(--crit)}
tr.e-warn td:first-child{border-left-color:var(--warn)}
tr.e-ok td:first-child{border-left-color:var(--ok)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;border-radius:999px;padding:3px 11px;font-size:13px;font-weight:700;white-space:nowrap}
.p-crit{background:var(--crit);color:#fff} .p-warn{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn)}
.p-ok{background:var(--ok);color:#fff} .p-neutro{background:var(--neutro-bg);color:var(--suave)}
.chip{display:inline-block;background:var(--crit-bg);color:var(--crit);border-radius:4px;padding:2px 7px;font-size:13px;margin:2px 4px 2px 0}
.chip.mas{background:var(--neutro-bg);color:var(--suave)}
.avance{display:flex;align-items:center;gap:8px;min-width:150px}
.avance i{flex:1;height:10px;background:var(--neutro-bg);border-radius:5px;overflow:hidden;display:block}
.avance i em{display:block;height:100%;background:var(--ok)}
.vacio{padding:28px;text-align:center;color:var(--suave)}
.dos{display:grid;grid-template-columns:330px 1fr;gap:16px;align-items:start}
@media(max-width:900px){.dos{grid-template-columns:1fr}.quien{margin-left:0}}
.lista{display:flex;flex-direction:column;gap:6px}
.item{background:var(--papel);border:1px solid var(--linea);border-left:6px solid var(--suave);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left;width:100%}
.item.on{outline:2px solid var(--vino);background:#fff8ea}
.item.e-crit{border-left-color:var(--crit)}.item.e-warn{border-left-color:var(--warn)}.item.e-ok{border-left-color:var(--ok)}
.item b{display:block}.item span{font-size:14px;color:var(--suave)}
.panel{background:var(--papel);border:1px solid var(--linea);border-radius:8px;padding:16px 18px}
.panel h2{margin:0 0 2px;font-size:24px;color:var(--vino)}
.meta{color:var(--suave);margin-bottom:10px}
.grupo{margin-top:18px}
.grupo h3{margin:0 0 6px;font-size:14px;text-transform:uppercase;letter-spacing:.8px;color:var(--vino);border-bottom:2px solid var(--dorado);padding-bottom:3px}
.req{display:flex;align-items:center;gap:12px;padding:8px 6px;border-bottom:1px solid var(--linea)}
.req .caja{width:34px;height:34px;flex:none;border-radius:7px;border:2px solid var(--crit);background:var(--crit-bg);cursor:pointer;font-size:20px;font-weight:700;color:#fff;line-height:1;padding:0}
.req.ok .caja{background:var(--ok);border-color:var(--ok)}
.req.na .caja{background:var(--neutro-bg);border-color:#b9ab98;color:var(--suave);font-size:12px}
.req .txt{flex:1;min-width:0}
.req .txt b{display:block}
.req.ok .txt b,.req.na .txt b{color:var(--suave);font-weight:400}
.req .det{display:inline-block;background:#fbf0d0;border:1px solid #ecd58f;border-radius:4px;padding:1px 7px;font-size:14px;margin-top:2px}
.req .por{font-size:13px;color:var(--suave);text-align:right;white-space:nowrap}
.acciones{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.links a,.guia a{color:var(--vino);font-weight:700}
details.guia{margin-top:18px;background:var(--crema);border:1px solid var(--linea);border-radius:8px;padding:10px 14px}
details.guia summary{cursor:pointer;font-weight:700;color:var(--vino)}
.guia dl{margin:8px 0 0;display:grid;grid-template-columns:minmax(140px,280px) 1fr;gap:4px 14px;font-size:15px}
.guia dt{font-weight:700}.guia dd{margin:0;overflow-wrap:anywhere}
@media(max-width:600px){.guia dl{grid-template-columns:1fr}}
.sub{display:flex;gap:6px;margin-bottom:14px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 14px;margin:10px 0}
.form label{display:flex;flex-direction:column;gap:3px;font-size:14px;color:var(--suave)}
.form label.ancho{grid-column:1/-1}
.form label.fila{flex-direction:row;align-items:center;gap:8px;color:var(--tinta);font-size:16px}
.mreq td{padding:5px 10px}.mreq input[type=text]{width:100%}
.mreq input[type=checkbox],.form input[type=checkbox]{width:20px;height:20px;accent-color:var(--vino)}
.mreq tr.gr td{background:var(--neutro-bg);font-weight:700;color:var(--vino);font-size:14px;text-transform:uppercase;letter-spacing:.6px}
h4{margin:16px 0 6px;color:var(--vino)}
#modal{position:fixed;inset:0;background:rgba(42,26,30,.55);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:10}
#modal.on{display:flex}
#modal .panel{max-width:720px;width:100%}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--tinta);color:#fff;padding:10px 18px;border-radius:8px;display:none;z-index:20;max-width:90vw}
.ej{background:var(--dorado);color:var(--vino);border-radius:4px;font-size:11px;font-weight:700;padding:1px 6px;margin-left:6px;vertical-align:middle}
.sec2{color:var(--suave);font-size:14px}
.resp{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.resp span{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--linea);border-radius:5px;padding:2px 4px 2px 8px;font-size:14px;max-width:100%}
.resp a{color:var(--vino);font-weight:700;overflow-wrap:anywhere}
.resp button{border:0;background:none;color:var(--crit);cursor:pointer;font-weight:700;padding:2px 6px;border-radius:4px}
.resp button:hover{background:var(--crit-bg)}
.req{flex-wrap:wrap}.req .txt{min-width:220px}
.clip{color:var(--suave);font-size:13px;white-space:nowrap}
.asig{background:var(--crema);border:1px solid var(--linea);border-radius:6px;padding:8px 12px}
.asig label,.aviso label{margin-right:10px}
</style>
</head>
<body>
<header>
  <h1>Control de requisitos SAG<small>C&amp;L Fruit · despachos de exportación</small></h1>
  <nav id="nav"></nav>
  <label class="quien" for="nombre">Responsable <input type="text" id="nombre" data-b="nombre" placeholder="Tu nombre" autocomplete="off"></label>
</header>
<main id="app"><div class="vacio">Cargando datos…</div></main>
<input type="file" id="archivo" multiple hidden>
<input type="file" id="importar" accept=".json" hidden>
<div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const urlOk=u=>/^https?:\/\//i.test(String(u||'').trim())?String(u).trim():'';
const N=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().trim();
const NE=s=>{let x=N(s);if(/[^AEIOU]ES$/.test(x))x=x.slice(0,-2);else if(/S$/.test(x))x=x.slice(0,-1);return x};
const slug=s=>N(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const fFecha=f=>f?f.split('-').reverse().join('-'):'sin fecha';
const hoy=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fHora=iso=>{if(!iso)return'';const d=new Date(iso);if(isNaN(d))return'';const p=n=>String(n).padStart(2,'0');return p(d.getDate())+'-'+p(d.getMonth()+1)+' '+p(d.getHours())+':'+p(d.getMinutes())};
const miles=n=>String(Math.round(n||0)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const GRUPOS=['Documentos','Res. 6510','Despacho'];
const VISTAS=[['seguimiento','Seguimiento'],['checklist','Checklist'],['mantenedor','Mantenedor']];
const ALIAS_PAIS={'ESTADOS UNIDOS':'USA','EEUU':'USA','EE.UU.':'USA','UNITED STATES':'USA','COREA DEL SUR':'Corea','REPUBLICA DE COREA':'Corea','KOREA':'Corea','BRAZIL':'Brasil','JAPAN':'Japón','FEDERACION RUSA':'Rusia','RUSSIA':'Rusia'};

const VIAS=['Marítimo','Aéreo','Terrestre','Chárter'];
const S={v:0,gruposActivos:['Despacho'],cat:[],mer:{},puertos:{},grupos:{},checks:{},asign:{},despachos:[],sdt:{},listo:false,aviso:'',
  vista:'seguimiento',sel:null,f:{q:'',esp:'',desp:false},mt:{tab:'mercados',sel:null,d:null,cat:null,grupos:null},conf:null,nombre:''};
try{S.nombre=localStorage.getItem('sag_nombre')||''}catch(e){}
$('#nombre').value=S.nombre;

/* ---------- lógica de requisitos ---------- */
function nomMer(m){return m?m.especie+' / '+m.mercado+(m.cond?' ('+m.cond+')':''):'—'}
const paises=()=>[...new Set([...Object.values(S.mer).filter(m=>!m.base).map(m=>m.mercado),...Object.values(S.puertos)])].sort((a,b)=>a.localeCompare(b,'es'));
function calce(mEsp,dEsp){ // 2 = misma especie, 1 = la especie pertenece al grupo del mercado
  if(NE(mEsp)===NE(dEsp))return 2;
  for(const g in S.grupos) if(NE(g)===NE(mEsp)&&(S.grupos[g]||[]).some(x=>NE(x)===NE(dEsp)))return 1;
  return 0;
}
function paisDe(d){
  const p=S.puertos[N(d.puerto)]; if(p)return p;
  if(d.pais){const a=ALIAS_PAIS[N(d.pais)]; if(a)return a; const m=paises().find(x=>N(x)===N(d.pais)); if(m)return m}
  return '';
}
function resolver(d){
  const pais=paisDe(d), partes=[], r={};
  for(const esp of (d.especies&&d.especies.length?d.especies:['(sin especie)'])){
    const todos=Object.entries(S.mer).filter(([k,m])=>!m.base&&calce(m.especie,esp)>0);
    const ov=(S.asign[d.id]||{})[esp];
    const p={esp,pais,opciones:todos.map(x=>x[0]),mid:null,estado:'ok'};
    if(ov&&S.mer[ov]) p.mid=ov;
    else if(!pais) p.estado='sinpais';
    else{
      const c=todos.filter(([k,m])=>N(m.mercado)===N(pais)), ex=c.filter(([k,m])=>calce(m.especie,esp)===2), pool=ex.length?ex:c;
      const firma=k=>JSON.stringify(S.cat.filter(c=>c.id in (S.mer[k].reqs||{})&&S.gruposActivos.includes(c.g)).map(c=>[c.id,S.mer[k].reqs[c.id]]));
      if(pool.length===1||(pool.length>1&&pool.every(x=>firma(x[0])===firma(pool[0][0])))){p.mid=pool[0][0];p.gen=pool.length>1} else if(pool.length>1){p.estado='elegir';p.sug=pool.map(x=>x[0])} else p.estado=Object.values(S.mer).some(b=>b.base&&calce(b.especie,esp)>0)?'base':'sinreq';
    }
    for(const k in S.mer){const b=S.mer[k]; if(b.base&&calce(b.especie,esp)>0)Object.assign(r,b.reqs||{})}
    if(p.mid)Object.assign(r,S.mer[p.mid].reqs||{});
    partes.push(p);
  }
  return {pais,partes,reqs:S.cat.filter(c=>c.id in r&&S.gruposActivos.includes(c.g)&&(!c.via||N(c.via)===N(d.tipoNave))).map(c=>({id:c.id,n:c.n,g:c.g,v:r[c.id]===true?'':String(r[c.id])}))};
}
function estado(d){
  const R=resolver(d), ch=S.checks[d.id]||{};
  const falta=R.reqs.filter(r=>!(ch[r.id]&&(ch[r.id].s==='ok'||ch[r.id].s==='na')));
  const o={R,rs:R.reqs,falta,total:R.reqs.length,hechos:R.reqs.length-falta.length};
  const prob=R.partes.find(p=>p.estado!=='ok'&&p.estado!=='base');
  if(d.cargado) return Object.assign(o,!o.total&&!prob?{t:'Despachado',c:'neutro'}:falta.length?{t:'Despachado · faltaron '+falta.length,c:'crit'}:{t:'Despachado',c:'neutro'});
  if(prob) return Object.assign(o,{t:prob.estado==='sinpais'?'Asignar país al puerto':prob.estado==='elegir'?'Elegir condición':'Sin requisitos definidos',c:'warn',prob:true});
  if(!o.total) return Object.assign(o,{t:'Sin requisitos de despacho',c:'neutro'});
  if(!falta.length) return Object.assign(o,{t:'Listo para despachar',c:'ok'});
  const h=hoy();
  if(d.fecha<h) return Object.assign(o,{t:'Atrasado · faltan '+falta.length,c:'crit'});
  if(d.fecha===h) return Object.assign(o,{t:'Hoy · faltan '+falta.length,c:'crit'});
  return Object.assign(o,{t:'Faltan '+falta.length,c:'warn'});
}
const todos=()=>S.despachos.map(d=>({id:d.id,d,e:estado(d)}));
function mercadoTxt(x){return x.e.R.partes.map(p=>p.mid?(p.gen?S.mer[p.mid].especie+' / '+S.mer[p.mid].mercado:nomMer(S.mer[p.mid])):p.esp+' / '+(p.pais||x.d.puerto||'¿país?')).join(' + ')}
function filtrados(){
  const q=S.f.q.trim().toLowerCase();
  return todos().filter(x=>{
    if(!S.f.desp&&x.d.cargado&&!x.e.falta.length) return false;
    if(S.f.esp&&!(x.d.especies||[]).some(e=>NE(e)===NE(S.f.esp))) return false;
    if(q&&!(x.d.codnave+' '+x.d.planilla+' '+mercadoTxt(x)+' '+x.d.puerto+' '+x.d.recibidor+' '+x.d.nave).toLowerCase().includes(q)) return false;
    return true;
  });
}
const nResp=id=>Object.values(S.checks[id]||{}).reduce((n,c)=>n+(c.archivos||[]).length,0);
const especiesSDT=()=>[...new Set(S.despachos.flatMap(d=>d.especies||[]))].sort((a,b)=>a.localeCompare(b,'es'));

/* ---------- datos: SharePoint por Microsoft Graph (o memoria en modo demo) ---------- */
const CFG={clientId:'10fd9db5-58cc-4b64-b3a9-ad33ab097b51',tenantId:'5946134b-9789-4d13-86c4-e01684301b6a',scopes:['Sites.ReadWrite.All','User.Read'],
  sitio:'https://cylfruit.sharepoint.com/sites/EXPORTADORACYL',carpeta:'APP REQUISITOS EXPORTACION/Respaldos',
  repo:'TomasCyL/Requisitos-sag',flujo:'sincronizar.yml',cadaSeg:10};
const LISTAS={RQ_Datos:'Valor',RQ_Mercados:'Datos',RQ_Checks:'Datos'};   // lista → columna con el JSON
const DEMO=/[?&]demo\b/.test(location.search);
const J=(t,d)=>{try{return t?JSON.parse(t):d}catch(e){return d}};

const Nube={ // Microsoft Graph con la cuenta Microsoft de cada persona
  _m:null,_c:null,_sid:null,_l:null,
  async msal(){
    if(this._m)return this._m;
    if(!window.msal)throw new Error('No se cargó la librería de inicio de sesión.');
    const base=location.origin+location.pathname.replace(/[^/]*$/,'');
    this._m=new msal.PublicClientApplication({auth:{clientId:CFG.clientId,authority:'https://login.microsoftonline.com/'+CFG.tenantId,redirectUri:base,navigateToLoginRequestUrl:false},cache:{cacheLocation:'localStorage'}});
    await this._m.initialize();
    const r=await this._m.handleRedirectPromise();
    this._c=(r&&r.account)||this._m.getAllAccounts()[0]||null;
    return this._m;
  },
  async sesion(){await this.msal();return !!this._c},
  async entrar(){const m=await this.msal();await m.loginRedirect({scopes:CFG.scopes})},
  async salir(){const m=await this.msal();await m.logoutRedirect({account:this._c})},
  async token(){
    const m=await this.msal();
    try{return (await m.acquireTokenSilent({scopes:CFG.scopes,account:this._c})).accessToken}
    catch(e){await m.acquireTokenRedirect({scopes:CFG.scopes,account:this._c});return new Promise(()=>{})}
  },
  async g(path,{method='GET',body,headers={},crudo}={}){
    const url=path.startsWith('http')?path:'https://graph.microsoft.com/v1.0'+path;
    const h={Authorization:'Bearer '+await this.token(),Accept:'application/json',...headers};
    if(body!==undefined&&!crudo)h['Content-Type']='application/json';
    const r=await fetch(url,{method,headers:h,body:body===undefined?undefined:crudo?body:JSON.stringify(body)});
    if(r.status===204)return null;
    const t=await r.text(), j=J(t,null);
    if(!r.ok){const e=new Error((j&&j.error&&j.error.message)||('Error '+r.status));e.status=r.status;throw e}
    return j;
  },
  async sid(){
    if(this._sid)return this._sid;
    const m=/^https:\/\/([^\/]+)(\/.*)?$/.exec(CFG.sitio);
    this._sid=(await this.g(`/sites/${m[1]}:${m[2]||'/'}`)).id;return this._sid;
  },
  async listas(){
    if(this._l)return this._l;
    const sid=await this.sid(), j=await this.g(`/sites/${sid}/lists?$select=id,displayName&$top=200`), l={};
    for(const x of j.value)l[x.displayName]=x.id;
    for(const n of Object.keys(LISTAS)) if(!l[n]) throw new Error('Falta la lista '+n+' en el sitio de SharePoint, o tu cuenta no tiene acceso al sitio.');
    return this._l=l;
  },
  async usuario(){try{const u=await this.g('/me?$select=displayName');return u.displayName||''}catch(e){return ''}},
  async items(lista){ // → [{id,etag,t,v}]
    const sid=await this.sid(), lid=(await this.listas())[lista], col=LISTAS[lista], out=[];
    let url=`/sites/${sid}/lists/${lid}/items?$expand=fields($select=Title,${col})&$top=999`;

  async leer(lista,id){

    const it=await this.g(`/sites/${sid}/lists/${lid}/items/${id}?$expand=fields($select=Title,${col})`);

  },
  async crear(lista,titulo,texto){
    const sid=await this.sid(), lid=(await this.listas())[lista];
    const it=await this.g(`/sites/${sid}/lists/${lid}/items`,{method:'POST',body:{fields:{Title:titulo,[LISTAS[lista]]:texto}}});
    return {id:it.id,etag:it.eTag||''};
  },
  async cambiar(lista,id,texto,etag){ // si etag no calza (otra persona guardó antes) → error con status 412
    const sid=await this.sid(), lid=(await this.listas())[lista];
    await this.g(`/sites/${sid}/lists/${lid}/items/${id}/fields`,{method:'PATCH',body:{[LISTAS[lista]]:texto},headers:etag?{'If-Match':etag}:{}});
  },
  async borrar(lista,id){const sid=await this.sid(), lid=(await this.listas())[lista];await this.g(`/sites/${sid}/lists/${lid}/items/${id}`,{method:'DELETE'})},
  async subir(ruta,archivo){ // → {id,url,kb}
    const sid=await this.sid(), p=(CFG.carpeta+'/'+ruta).split('/').map(encodeURIComponent).join('/');
    const j=await this.g(`/sites/${sid}/drive/root:/${p}:/content?@microsoft.graph.conflictBehavior=rename`,{method:'PUT',body:archivo,crudo:true,headers:{'Content-Type':'application/octet-stream'}});
    return {id:j.id,url:j.webUrl,kb:Math.max(1,Math.round((j.size||archivo.size)/1024))};
  },
  async quitarArchivo(id){const sid=await this.sid();try{await this.g(`/sites/${sid}/drive/items/${id}`,{method:'DELETE'})}catch(e){if(e.status!==404)throw e}}
};

const Memoria={ // modo demo (?demo): nada se guarda ni sale del navegador

async function cargar(){
  const [da,me,ch]=await Promise.all([B.items('RQ_Datos'),B.items('RQ_Mercados'),B.items('RQ_Checks')]);
  const h=JSON.stringify([da,me,ch].map(l=>l.map(x=>x.id+x.etag)));
  for(const [n,l] of [['RQ_Datos',da],['RQ_Mercados',me],['RQ_Checks',ch]]){IDS[n].clear();for(const x of l)if(x.t&&!IDS[n].has(x.t))IDS[n].set(x.t,x.id)}
  if(h===huella&&S.listo)return false; huella=h;
  const D={};for(const x of da)if(!(x.t in D))D[x.t]=J(x.v,null);
  const cat=D.cat||{};
  S.cat=cat.items||[]; S.gruposActivos=cat.gruposActivos||['Despacho']; S.puertos=D.puertos||{}; S.grupos=D.grupos||{};
  S.despachos=D.despachos||[]; S.sdt=Object.assign({demo:DEMO},D.sdt||{}); S.github=!!(D.github&&D.github.token); S._gh=D.github||{};
  S.sinMatriz=!D.cat;
  S.mer={};for(const x of me){const d=J(x.v,null);if(d&&x.t)S.mer[x.t]=d}
  S.checks={};S.asign={};
  for(const x of ch){const d=J(x.v,null);if(!d||!x.t)continue;const o=S.checks[x.t]=Object.assign(S.checks[x.t]||{},d);if(o._asign){S.asign[x.t]=Object.assign(S.asign[x.t]||{},o._asign);delete o._asign}}
  S.listo=true;S.aviso='';return true;
}
async function guardarDato(clave,valor){
  const t=JSON.stringify(valor), id=IDS.RQ_Datos.get(clave);
  if(id)await B.cambiar('RQ_Datos',id,t);else IDS.RQ_Datos.set(clave,(await B.crear('RQ_Datos',clave,t)).id);
}
async function modificar(lista,titulo,fn){ // leer lo último → aplicar el cambio → guardar; reintenta si otra persona guardó entremedio
  for(let i=0;i<4;i++){
    const id=IDS[lista].get(titulo);
    if(!id){const o={};fn(o);IDS[lista].set(titulo,(await B.crear(lista,titulo,JSON.stringify(o))).id);return}
    const it=await B.leer(lista,id), o=J(it.v,{})||{}; fn(o);
    try{await B.cambiar(lista,id,JSON.stringify(o),it.etag);return}catch(e){if(e.status!==412&&e.status!==409)throw e}
  }
  throw new Error('No se pudo guardar: otra persona está guardando el mismo despacho. Intenta de nuevo.');
}
const ahoraISO=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())};

    S.pidio=Date.now();
  }
};

async function sembrar(e){ // primera vez: carga la matriz (semilla.json o el estado.json de la versión local)
  S.sembrando='Cargando la matriz…';render();
  try{
    const cat=e.cat||[], mer=e.mer||{};
    if(!cat.length||!Object.keys(mer).length)throw new Error('El archivo no trae la matriz de requisitos.');
    let n=0;for(const [k,m] of Object.entries(mer)){S.sembrando='Cargando mercados… '+(++n)+' de '+Object.keys(mer).length;render();await ACC['/api/mercado']({id:k,doc:m})}
    await guardarDato('puertos',e.puertos||{});await guardarDato('grupos',e.grupos||{});
    for(const [id,o] of Object.entries(e.checks||{})){const d=Object.assign({},o);if((e.asign||{})[id])d._asign=e.asign[id];for(const r in d)if(d[r]&&d[r].archivos)delete d[r].archivos;await modificar('RQ_Checks',id,x=>Object.assign(x,d))}
    await guardarDato('cat',{items:cat,gruposActivos:e.gruposActivos||['Despacho']});

          ${(c.archivos||[]).length?`<div class="resp">${c.archivos.map(a=>`<span><a href="${esc(a.url||'#')}" target="_blank" rel="noopener" title="Subido por ${esc(a.by||'sin nombre')} el ${fHora(a.at)} · ${miles(a.kb)} KB">${esc(a.n)}</a><button data-a="rquita" data-r="${esc(r.id)}" data-f="${esc(a.f)}" aria-label="Quitar respaldo ${esc(a.n)}">${S.conf==='rq:'+r.id+':'+a.f?'¿Quitar?':'×'}</button></span>`).join('')}</div>`:''}</div>
        <div class="por">${s?esc(c.by||'Sin nombre')+'<br>'+fHora(c.at):''}</div>
        <button class="btn sec chico" data-a="rsube" data-r="${esc(r.id)}">${S.sube===d.id+':'+r.id?'Subiendo…':'Subir respaldo'}</button>

    }
    der+='</div>';
  }
  for(const k of mids){const m=S.mer[k]; if(m.guia&&m.guia.length) der+=`<details class="guia"><summary>Guía de referencia ${esc(nomMer(m))}</summary><dl>${m.guia.map(g=>`<dt>${esc(g.t)}</dt><dd>${esc(g.d||'')}${urlOk(g.u)?` <a href="${esc(urlOk(g.u))}" target="_blank" rel="noopener">Abrir ↗</a>`:''}</dd>`).join('')}</dl></details>`}
  return `<div class="dos">${izq}${der}</div></div>`;
}

    </div><datalist id="dl_esp">${[...new Set(Object.values(S.mer).map(m=>m.especie))].sort().map(e=>`<option value="${esc(e)}">`).join('')}</datalist><datalist id="dl_pais">${paises().map(e=>`<option value="${esc(e)}">`).join('')}</datalist>

  else h+=barraSDT()+(S.vista==='checklist'?vChecklist():S.vista==='mantenedor'?vMantenedor():vSeguimiento());

  if(aid){const n=document.getElementById(aid); if(n){n.focus({preventScroll:true}); try{if(s0!=null)n.setSelectionRange(s0,s1)}catch(e){}}}

/* ---------- mantenedor: borrador ---------- */
function borrador(m){
  const d=JSON.parse(JSON.stringify(m||{especie:'',mercado:'',cond:'',base:false,reqs:{},links:[],guia:[]}));
  d.reqs=d.reqs||{}; d.cond=d.cond||'';
  d._links=(d.links||[]).map(l=>(l.t||'')+' | '+(l.u||'')).join('\n');
  d._guia=(d.guia||[]).map(g=>[g.t||'',g.d||'',g.u||''].join(' | ').replace(/( \| )+$/,'')).join('\n');
  return d;
}
async function guardarMercado(){
  const M=S.mt,d=M.d; const esp=d.especie.trim(), mer=d.mercado.trim();
  if(!esp||!mer){toast('Completa especie y mercado.');return}
  const lineas=t=>String(t||'').split('\n').map(l=>l.trim()).filter(Boolean);
  const doc={especie:esp,mercado:mer,cond:d.cond.trim(),base:!!d.base,reqs:d.reqs,
    links:lineas(d._links).map(l=>{const p=l.split('|');return{t:(p[0]||'').trim(),u:p.slice(1).join('|').trim()}}),
    guia:lineas(d._guia).map(l=>{const p=l.split('|').map(x=>x.trim());const g={t:p[0]};if(p[1])g.d=p[1];if(p[2])g.u=p.slice(2).join('|');return g})};
  let id=M.sel;
  if(!id){id=slug(esp+'-'+mer+(doc.cond?'-'+doc.cond:''))||'m'+Date.now(); if(S.mer[id]) id+='-'+Date.now().toString(36)}
  M.sel=id; M.d=borrador(doc);
  await enviar('/api/mercado',{id,doc},'Mercado guardado.');
}

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]'); if(!t)return;
  const a=t.dataset.a, M=S.mt;
  const conf=k=>{if(S.conf===k){S.conf=null;return true}S.conf=k;render();return false};
  if(a!=='mborrar'&&a!=='rquita') S.conf=null;
  if(a==='abrir'){S.sel=t.dataset.id;S.vista='checklist';location.hash='checklist';render();scrollTo(0,0)}
  else if(a==='sel'){S.sel=t.dataset.id;render()}
  else if(a==='chk'){enviar('/api/check',{id:S.sel,rid:t.dataset.r,s:t.dataset.s,by:S.nombre})}
  else if(a==='rsube'){S.up={id:S.sel,rid:t.dataset.r};const f=$('#archivo');f.value='';f.click()}
  else if(a==='rquita'){if(conf('rq:'+t.dataset.r+':'+t.dataset.f))enviar('/api/respaldo_borrar',{id:S.sel,rid:t.dataset.r,f:t.dataset.f},'Respaldo quitado.')}
  else if(a==='auto')enviar('/api/condicion',{id:S.sel,especie:t.dataset.e,mercadoId:''});
  else if(a==='sync'){enviar('/api/sincronizar',{},'Lectura pedida al robot: se actualiza sola en cerca de un minuto.')}
  else if(a==='entrar')B.entrar();
  else if(a==='salir')B.salir();
  else if(a==='ghguardar'){const v=$('#gh_tk').value.trim();if(!v)toast('Pega el token antes de guardar.');else enviar('/api/github',{token:v},'Llave guardada.')}
  else if(a==='semilla'){fetch('semilla.json').then(r=>r.json()).then(sembrar).catch(()=>toast('No se pudo leer la matriz inicial.'))}
  else if(a==='importar'){const f=$('#importar');f.value='';f.click()}
  else if(a==='mtab'){M.tab=t.dataset.t;M.grupos=null;render()}
  else if(a==='msel'){M.sel=t.dataset.id;M.d=borrador(S.mer[M.sel]);render()}
  else if(a==='mnuevo'){M.sel=null;M.d=borrador(null);render();const n=$('#m_especie');if(n)n.focus()}
  else if(a==='mdup'){M.sel=null;M.d.cond=(M.d.cond?M.d.cond+' ':'')+'(copia)';render();toast('Copia lista: ajusta la condición o el mercado y guarda.')}
  else if(a==='mguardar')guardarMercado();
  else if(a==='mborrar'){if(conf('mborrar')){const id=M.sel;M.sel=null;M.d=null;enviar('/api/mercado_borrar',{id},'Mercado eliminado.')}}
  else if(a==='cnuevo'){M.cat.push({id:'r'+Date.now().toString(36),n:'Nuevo requisito',g:'Despacho',via:''});render()}
  else if(a==='cquita'){M.cat.splice(+t.dataset.i,1);render()}
  else if(a==='csube'||a==='cbaja'){const i=+t.dataset.i,j=i+(a==='csube'?-1:1);if(j>=0&&j<M.cat.length){[M.cat[i],M.cat[j]]=[M.cat[j],M.cat[i]];render()}}
  else if(a==='cdescartar'){M.cat=null;render()}
  else if(a==='cguardar'){const items=M.cat.map(c=>({id:c.id,n:String(c.n).trim()||'Sin nombre',g:c.g,via:c.via||''}));const ga=M.ga;M.cat=null;enviar('/api/catalogo',{items,gruposActivos:ga},'Catálogo guardado.')}
  else if(a==='gguardar'){const grupos={};String(M.grupos||'').split('\n').forEach(l=>{const i=l.indexOf(':');if(i>0)grupos[l.slice(0,i).trim()]=l.slice(i+1).split(',').map(x=>x.trim()).filter(Boolean)});M.grupos=null;enviar('/api/grupos',{grupos},'Grupos guardados.')}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('tr.fila'))e.target.click()});

  else if(b==='c.n')M.cat[+t.dataset.i].n=t.value;

});
$('#archivo').addEventListener('change',async e=>{
  const fs=[...e.target.files], u=S.up; if(!u||!fs.length)return;
  S.sube=u.id+':'+u.rid; render(); let ok=0;
  for(const f of fs){
    if(f.size>25*1024*1024){toast('«'+f.name+'» pesa más de 25 MB y no se subió.');continue}
    try{
      const limpio=f.name.replace(/["*:<>?\/\\|#%]/g,'_').trim()||'respaldo';
      const r=await B.subir(u.id+'/'+u.rid+'/'+limpio,f);
      await modificar('RQ_Checks',u.id,o=>{o[u.rid]=o[u.rid]||{s:''};(o[u.rid].archivos=o[u.rid].archivos||[]).push({n:f.name,f:r.id,url:r.url,kb:r.kb,by:S.nombre,at:ahoraISO()})});
      ok++;
    }catch(x){toast('No se pudo subir «'+f.name+'»: '+(x.message||'sin conexión'))}
  }
  S.sube=null; e.target.value=''; huella=''; try{await cargar()}catch(x){} render(); if(ok)toast(ok===1?'Respaldo subido.':ok+' respaldos subidos.');
});
$('#importar').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{sembrar(JSON.parse(await f.text()))}catch(x){toast('Ese archivo no es un estado.json válido.')}});
document.addEventListener('change',e=>{const t=e.target; if(t.dataset&&t.dataset.c==='puerto'){const v=t.value.trim();t.blur();enviar('/api/puerto',{puerto:t.dataset.p,pais:v},v?'Puerto asignado a '+v+'.':'Puerto sin país.')}});
function ruta(){const h=location.hash.slice(1);S.vista=VISTAS.some(v=>v[0]===h)?h:'seguimiento';S.conf=null;render()}
addEventListener('hashchange',ruta);
iniciar();
setInterval(()=>{if(S.vista==='seguimiento'&&!document.activeElement.closest('#app'))render()},60000);
</script>
